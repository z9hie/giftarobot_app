<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GiftARobot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(160deg, #0B0E14 0%, #43557A 100%);
            background-attachment: fixed;
            color: #ffffff;
            font-family: 'Unbounded', sans-serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100dvh;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
        }

        /* Header */
        .header {
            padding: 28px 20px 12px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            position: relative;
            line-height: 1;
        }

        .logo-a {
            position: relative;
            display: inline-block;
        }

        /* Lottie-анимация на месте буквы A */
        .hat-lottie {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            width: 48px;
            height: 48px;
            pointer-events: none;
            filter: drop-shadow(0 4px 12px rgba(124, 92, 255, 0.5));
        }

        /* Контент */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 24px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
            -webkit-overflow-scrolling: touch;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .content::-webkit-scrollbar { width: 3px; }
        .content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        .placeholder {
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            font-weight: 400;
            line-height: 1.6;
        }

        /* Адаптация под ПК */
        @media (min-width: 768px) {
            .app {
                max-width: 480px;
                margin: 0 auto;
                border-left: 1px solid rgba(255, 255, 255, 0.05);
                border-right: 1px solid rgba(255, 255, 255, 0.05);
            }

            .logo {
                font-size: 34px;
            }

            .hat-lottie {
                width: 54px;
                height: 54px;
                top: -28px;
            }
        }

        /* Адаптация под iPhone */
        @supports (padding: max(0px)) {
            .app {
                padding-top: max(env(safe-area-inset-top), 12px);
                padding-bottom: max(env(safe-area-inset-bottom), 12px);
            }
        }

        /* Адаптация под Android (низкие экраны) */
        @media (max-height: 700px) {
            .header {
                padding: 20px 20px 8px;
            }

            .logo {
                font-size: 26px;
            }

            .hat-lottie {
                width: 40px;
                height: 40px;
                top: -20px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <h1 class="logo">
                Gift<span class="logo-a">A<span class="hat-lottie" id="hat-lottie"></span></span>Robot
            </h1>
        </header>

        <main class="content">
            <div class="placeholder">
                Здесь будет контент приложения
            </div>
        </main>
    </div>

    <script>
        // Telegram WebApp
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();

            if (typeof tg.requestFullscreen === 'function') {
                tg.requestFullscreen();
            }

            if (tg.setHeaderColor) tg.setHeaderColor('#0B0E14');
            if (tg.setBackgroundColor) tg.setBackgroundColor('#0B0E14');
            if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
        }

        // Lottie-анимация шляпы
        const hatContainer = document.getElementById('hat-lottie');
        if (hatContainer && window.lottie) {
            lottie.loadAnimation({
                container: hatContainer,
                renderer: 'svg',
                loop: true,
                autoplay: true,
                path: 'img/witchhat.json'  // путь к твоему Lottie-файлу
            });
        }
    </script>
</body>
</html>
