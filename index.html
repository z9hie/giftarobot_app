<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GiftARobot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(160deg, #0B0E14 0%, #43557A 100%);
            background-attachment: fixed;
            color: #ffffff;
            font-family: 'Unbounded', sans-serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100dvh;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
            position: relative;
        }

        /* Header */
        .header {
            padding: 24px 20px 12px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1;
        }

        /* Контент */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 100px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
            -webkit-overflow-scrolling: touch;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .content::-webkit-scrollbar { width: 3px; }
        .content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        .placeholder {
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            font-weight: 400;
            line-height: 1.6;
        }

        /* ==========================================
           НИЖНЯЯ НАВИГАЦИЯ (как на app.png)
           ========================================== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 8px calc(12px + env(safe-area-inset-bottom, 0px));
            background: rgba(11, 14, 20, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Unbounded', sans-serif;
            font-size: 10px;
            font-weight: 600;
            flex: 1;
            max-width: 90px;
        }

        .nav-item.active {
            background: linear-gradient(135deg, #7C5CFF, #2DD4BF);
            color: #ffffff;
            box-shadow: 0 8px 24px rgba(124, 92, 255, 0.35);
        }

        .nav-item:active {
            transform: scale(0.94);
        }

        .nav-icon {
            font-size: 20px;
            line-height: 1;
        }

        /* ==========================================
           АДАПТАЦИЯ ПОД ПК
           ========================================== */
        @media (min-width: 768px) {
            .logo {
                font-size: 36px;
            }

            .bottom-nav {
                max-width: 600px;
                left: 50%;
                right: auto;
                transform: translateX(-50%);
                border-radius: 20px 20px 0 0;
                border-left: 1px solid rgba(255, 255, 255, 0.05);
                border-right: 1px solid rgba(255, 255, 255, 0.05);
            }

            .nav-item {
                max-width: 120px;
                font-size: 11px;
            }

            .nav-icon {
                font-size: 22px;
            }
        }

        /* ==========================================
           АДАПТАЦИЯ ПОД IPHONE
           ========================================== */
        @supports (padding: max(0px)) {
            .app {
                padding-top: max(env(safe-area-inset-top), 12px);
            }
        }

        /* ==========================================
           АДАПТАЦИЯ ПОД ANDROID (низкие экраны)
           ========================================== */
        @media (max-height: 700px) {
            .header {
                padding: 16px 20px 8px;
            }

            .logo {
                font-size: 24px;
            }

            .bottom-nav {
                padding: 8px 6px calc(8px + env(safe-area-inset-bottom, 0px));
            }

            .nav-icon {
                font-size: 18px;
            }

            .nav-item {
                font-size: 9px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <h1 class="logo">GiftARobot</h1>
        </header>

        <main class="content">
            <div class="placeholder">
                Здесь будет контент приложения
            </div>
        </main>

        <!-- Нижняя навигация -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-tab="markets">
                <span class="nav-icon">🏪</span>
                <span>Маркеты</span>
            </button>
            <button class="nav-item" data-tab="nft">
                <span class="nav-icon">💎</span>
                <span>Что такое NFT?</span>
            </button>
            <button class="nav-item" data-tab="guide">
                <span class="nav-icon">📖</span>
                <span>Гайды</span>
            </button>
            <button class="nav-item" data-tab="profile">
                <span class="nav-icon">👤</span>
                <span>Профиль</span>
            </button>
        </nav>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();

            if (typeof tg.requestFullscreen === 'function') {
                tg.requestFullscreen();
            }

            if (tg.setHeaderColor) tg.setHeaderColor('#0B0E14');
            if (tg.setBackgroundColor) tg.setBackgroundColor('#0B0E14');
            if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
        }

        // Переключение вкладок
        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                navItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');

                if (tg?.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('light');
                }
            });
        });
    </script>
</body>
</html>
